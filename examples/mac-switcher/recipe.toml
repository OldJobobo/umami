# Mac switcher: Omarchy for people coming from macOS.
#
# A dock along the bottom, Spotlight on Super+Space, Alt+Tab through your
# windows, a menu bar with the clock on the right, rounded windows with a
# soft shadow, a light theme, and natural scrolling with two-finger right
# click on the touchpad, and Files and video windows that float like Finder
# and QuickTime windows. The pieces come from the Omarchy plugin
# marketplace (plugins.omarchy.org).
#
#   Super + Space            Spotlight: apps, files, calculator, web
#   Super + Alt + Space      Omarchy menu        (was Super + Space)
#   Alt + Tab                switch windows, most recent first (Fathom)
#   Super + Q / Super + W    close the window    (stock, like Cmd+Q / Cmd+W)
#   Super + Shift + Space    hide or show the bar (stock)
#
# The plugins are installed for each user at login, as ordinary user plugins
# (`umami user-sync`), only after the user says yes to Omarchy's own plugin
# warning, and never into Omarchy's own tree: there a plugin would be
# first-party and get every capability its manifest asks for. Each is pinned
# to the commit the marketplace validated, as of 2026-11-16.
#
# The flavor is declarative: every line is data that umami checks and turns
# into configuration, and nothing in it runs as written. Fathom's Alt+Tab
# needs its own Hyprland file; `plugin.hypr` loads it from Fathom's install,
# so the code that runs is Fathom's, which the user accepted.
#
# The dock needs no settings: by default it sits opposite the bar, at the
# bottom, stays visible and keeps windows clear of it, as on a Mac. Its "···"
# widget in the bar changes that (autohide, overlay, widgets).

[flavor]
name = "mac-switcher"

# Applied once, at each user's first login on the flavor. Change them
# afterwards and your choice stays.
[defaults]
theme = "White"

# The menu bar: the Omarchy menu and workspaces on the left, where stock puts
# them and where the Apple menu sits, and the clock last on the right with
# the date, as macOS shows it ("Tue 17 Nov  09:14").
[defaults.bar]
move = [
  { id = "omarchy.clock", section = "right", index = 99 },
]
set = [
  { id = "omarchy.clock", key = "format", value = "ddd d MMM  HH:mm" },
]

[[plugin]]
id = "rosakodu.dock"
repo = "https://github.com/rosakodu/omarchy-dock"
commit = "bec892a5b3c360c97a28d69d6c27b5c2931f066c"
note = "An animated application dock along the bottom edge."

[[plugin]]
id = "io.github.maajix.spotlight"
repo = "https://github.com/maajix/omarchy-spotlight"
commit = "c421a257b440af40d4344db0f7b150e3ccabaea8"
note = "A Spotlight-style launcher: apps, files, calculator, web."

[[plugin]]
id = "io.github.mtolhuys.fathom"
repo = "https://github.com/mtolhuys/fathom"
commit = "98856b78908d35a977a508cf8974b3fa6b4f5a46"
note = "Alt+Tab through recent windows, most recent first."

[[plugin]]
id = "io.github.sirjul1337.lock-explorer"
repo = "https://github.com/SirJul1337/omarchy-lock-explorer"
commit = "6eaabfa5c385b3899c60ad139033ce2e418296a9"
note = "Lock screen designs. Replaces omarchy.lock while enabled (clonedFrom)."

# ------------------------------------------------------------------- look

# Rounded corners, a soft shadow and a little blur. Stock gaps and
# animations stay.
[[transform]]
id = "rounded-corners"
type = "lua.set"
path = "decoration.rounding"
value = 10

[[transform]]
id = "soft-shadows"
type = "lua.set"
path = "decoration.shadow.enabled"
value = true

[[transform]]
id = "blur"
type = "lua.set"
path = "decoration.blur.enabled"
value = true

# --------------------------------------------------------------- touchpad
# Scrolling moves the content, and a two-finger click is a right click, as
# on a Mac. Your own ~/.config/hypr/input.lua still wins.

[[transform]]
id = "natural-scrolling"
type = "lua.set"
path = "input.touchpad.natural_scroll"
value = true

[[transform]]
id = "two-finger-right-click"
type = "lua.set"
path = "input.touchpad.clickfinger_behavior"
value = true

# ------------------------------------------------------------------- keys

# Super+Space is Spotlight, as Cmd+Space is on a Mac. Spotlight launches
# apps, so it replaces the Apps grid's key too, and the Omarchy menu moves
# there. (Alt+Space, Spotlight's own default, is dictation in stock Omarchy
# whenever a dictation backend is installed.)
# Files and mpv open floating and centered, as a Finder window or a QuickTime
# player does, instead of taking a tile.
[[transform]]
id = "files-float"
type = "window.rule"
match = { class = "^folio$" }
rules = { float = true, center = true, size = [1100, 700] }

[[transform]]
id = "video-floats"
type = "window.rule"
match = { class = "^mpv$" }
rules = { float = true, center = true }

[[transform]]
id = "spotlight-key"
type = "bind.replace"
keys = "SUPER + SPACE"
description = "Spotlight"
action = { panel = "io.github.maajix.spotlight" }

[[transform]]
id = "menu-key"
type = "bind.replace"
keys = "SUPER + ALT + SPACE"
description = "Omarchy menu"
action = { menu = "root" }

# Alt+Tab goes to Fathom. Fathom ships this file: it takes Alt+Tab and
# Alt+Shift+Tab from Omarchy while Fathom is enabled, and does nothing
# otherwise. Its README asks you to load it from ~/.config/hypr/bindings.lua;
# the flavor does it for everyone who installed Fathom.
[[transform]]
id = "fathom-alt-tab"
type = "plugin.hypr"
plugin = "io.github.mtolhuys.fathom"
file = "hypr/fathom.lua"
