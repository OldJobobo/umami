# Server: Omarchy as a machine that runs services.
#
# A home or office box that runs containers and services, reached over SSH
# and Tailscale, with Omarchy's desktop there when a screen is plugged in.
# It is still Omarchy underneath: updates, channels and snapshots keep
# working.
#
# The machine:
#
#   - boots to a text console, not the desktop: Hyprland, the shell and the
#     login screen don't run until you start them with
#       sudo systemctl start sddm
#   - never sleeps: not on idle, not when the lid closes, not on a key
#   - runs sshd (keys only, port 22 open in the firewall, rate limited),
#     Tailscale and Docker
#   - turns off Bluetooth and printing
#
# Authorize a key before you rely on SSH: password logins are off.
#
#   omarchy-setup-security-sshd --gh-keys <github-user>
#   sudo tailscale up
#
# It also removes Omarchy's media, office and writing apps. umami remove
# puts all of it back as it was: it reinstalls those apps and removes the
# packages the flavor installed.
#
# When you do start the desktop, it is a quiet one: no animations, blur or
# shadows, no screensaver, the performance power profile, no web apps or
# their keys, no music, chat or notes keys, Tailscale on the bar, and keys
# for the tools:
#
#   Super + Shift + D          Docker (lazydocker)            (stock)
#   Super + Shift + T          Activity (btop)                (stock)
#   Super + Ctrl + Alt + S     internet speed test
#   Super + Ctrl + Alt + K     disk speed test
#
# Server is declarative: every line is data that umami checks and turns
# into configuration, and nothing in it runs as written.

[flavor]
name = "server"

# The machine around Omarchy. Recorded when the flavor is installed, and put
# back by umami remove.
[system]
boot = "console"
sleep = false

[system.services]
enable = ["sshd", "tailscaled", "docker"]
disable = ["bluetooth", "cups"]

# Applied once, at each user's first login on the flavor.
[defaults]
theme = "Matte Black"
power_profile = "performance"          # on AC power
idle = { screensaver = 0 }             # no screensaver; the screen still locks

# The web apps, out of the app launcher: their keys are gone below too.
[defaults.apps]
hide = ["Basecamp", "Discord", "Google Contacts", "Google Maps", "Google Messages", "Google Photos",
        "HEY", "WhatsApp", "X", "YouTube", "Zoom"]

# Switched off once, so a user can turn any of them back on. Tailscale goes
# first on the right, where its status and machines are a click away.
[defaults.bar]
remove = [
  "omarchy.elsewhen",
  "omarchy.weather",
  "omarchy.agents",
  "omarchy.keyboard-layout",
]
add = [
  { id = "omarchy.tailscale", section = "right", index = 0 },
]
set = [
  { id = "omarchy.clock", key = "format", value = "ddd d MMM  HH:mm" },
]

# Installed with the flavor, from the official repositories. Docker, compose,
# btop, tmux and ufw already come with Omarchy.
[[package]]
name = "openssh"
note = "The SSH server. Omarchy usually has it already."

[[package]]
name = "tailscale"
note = "Mesh VPN: reach this machine from anywhere, and the Tailscale widget on the bar."

[[package]]
name = "mosh"
note = "SSH that survives sleep, roaming and bad links."

[[package]]
name = "lazydocker"
note = "Containers in a terminal; turns on Omarchy's Super + Shift + D."

[[package]]
name = "smartmontools"
note = "Disk health (smartctl)."

[[package]]
name = "nvme-cli"
note = "NVMe health and firmware."

[[package]]
name = "lm_sensors"
note = "Temperatures and fans (sensors), which btop also shows."

[[package]]
name = "restic"
note = "Encrypted, deduplicated backups."

[[package]]
name = "rsync"
note = "Copy and mirror files over SSH."

[[package]]
name = "iperf3"
note = "Measure the network between two machines."

[[package]]
name = "ethtool"
note = "Link speed and Wake-on-LAN settings."

[[package]]
name = "ncdu"
note = "Find what is filling a disk."

# Removed with the flavor: Omarchy's apps for media, office work and writing.
# Omarchy's updates don't put a removed app back; umami remove reinstalls
# them. An app this machine doesn't have is skipped. LocalSend, the
# calculator and gliff (remote desktop over SSH) stay.

[[package]]
name = "obsidian"
remove = true
note = "Notes."

[[package]]
name = "libreoffice-fresh"
remove = true
note = "Office suite."

[[package]]
name = "pinta"
remove = true
note = "Image editor."

[[package]]
name = "cliamp"
remove = true
note = "Music player."

[[package]]
name = "omacut"
remove = true
note = "Video trimmer."

[[package]]
name = "omawrite"
remove = true
note = "Writing app."

[[package]]
name = "monologue"
remove = true
note = "Webcam recorder."

[[package]]
name = "hype"
remove = true
note = "Presentations."

[[package]]
name = "signed"
remove = true
note = "PDF signing."

[[package]]
name = "spotify"
remove = true
note = "Music, on older installs."

[[package]]
name = "signal-desktop"
remove = true
note = "Chat, on older installs."

[[package]]
name = "typora"
remove = true
note = "Markdown editor, on older installs."

# ------------------------------------------------------------------ quiet

[[transform]]
id = "no-animations"
type = "lua.set"
path = "animations.enabled"
value = false

[[transform]]
id = "no-blur"
type = "lua.set"
path = "decoration.blur.enabled"
value = false

[[transform]]
id = "no-shadows"
type = "lua.set"
path = "decoration.shadow.enabled"
value = false

# ------------------------------------------------------- server keys

[[transform]]
id = "speed-test-key"
type = "bind.add"
keys = "SUPER + CTRL + ALT + S"
description = "Internet speed test"
action = { panel = "omarchy.speedtest" }

[[transform]]
id = "disk-speed-test-key"
type = "bind.add"
keys = "SUPER + CTRL + ALT + K"
description = "Disk speed test"
action = { panel = "omarchy.disk-speedtest" }

# The keys for the world clock and weather, which are off the bar.
[[transform]]
id = "no-weather-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + W"

[[transform]]
id = "no-world-clock-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + E"

