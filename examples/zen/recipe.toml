# Zen: a quiet, keyboard-first Omarchy.
#
# Less on screen: the Vantablack theme, no animations, blur or shadows,
# square tight tiles, and a bar without the world clock, weather and AI usage
# widgets. More from the keyboard: vim keys for windows, and a which-key
# guide whenever you hold Super. The web-app shortcuts are gone, so
# Super+Shift is free for moving windows.
#
#   Super + H/J/K/L            focus left/down/up/right
#   Super + Shift + H/J/K/L    swap the window left/down/up/right
#   hold Super                 which-key: every binding you can press next
#   Super + ;                  toggle split        (was Super + J)
#   Super + Backslash          cycle layout        (was Super + L)
#   Super + ?                  keybindings sheet   (was Super + K)
#   Super + Shift + Space      hide or show the bar (stock)
#
# The plugins come from the Omarchy marketplace (plugins.omarchy.org), are
# installed for each user at login as ordinary user plugins, and are pinned to
# the commit the marketplace validated, as of 2026-11-16.
#
# Zen is declarative: every line is data that umami checks and
# turns into configuration, and nothing in it runs as written. The plugins
# are installed only after you say yes, with Omarchy's own warning.
#
# One step is yours: which-key hooks into Hyprland by adding a marked block to
# your own ~/.config/hypr/bindings.lua, so the flavor leaves that to you. Open
# the Which Key widget's settings in the bar and turn on Enabled.

[flavor]
name = "zen"

# Applied once, at each user's first login on the flavor. Pick another theme
# afterwards and it stays.
[defaults]
theme = "Vantablack"

# The bar: the time and date small on the left, the workspaces in the
# middle, and on the right the status indicators, the tray and Pocket's mark,
# with everything else behind it. Point at the mark to bring them out.
#
# A widget goes only where its shortcut works without it. The menu button
# (Super+Space) and the keyboard layout (Super+I) are taken off, and so are
# the world clock, weather and AI usage widgets, with their keys. They are
# only switched off: turn one back on in the bar's settings and it stays. The Audio,
# Network, Bluetooth, Display and Power panels open from their bar icon, so
# Super+Ctrl+A/N/B/D/P need them: they go in Pocket, and their panels still
# open from there. So does which-key's icon, which holds its Enabled switch.
# The tray stays out, so apps in it are one click away. The update notice
# stays out too, where stock puts it beside the workspaces: it only shows
# when updates are ready, and that should be seen.
#
# Applied once, through Omarchy's own `omarchy plugin disable` and
# `omarchy bar move/set`, so a layout you make afterwards stays. When a new
# Zen changes an entry here, only that entry is applied again. Pocket
# holds the run of its members just left of its mark, so it goes last and
# the tray goes before that run.
[defaults.bar]
remove = [
  "omarchy.menu",
  "omarchy.keyboard-layout",
  "omarchy.elsewhen",
  "omarchy.weather",
  "omarchy.agents",
]
move = [
  { id = "omarchy.workspaces", section = "center", index = 0 },
  { id = "omarchy.clock", section = "left", index = 0 },
  { id = "omarchy.indicators", section = "right", index = 0 },
  { id = "omarchy.tray", section = "right", index = 1 },
  { id = "jrmmhm.pocket", section = "right", index = 99 },
]
set = [
  { id = "omarchy.clock", key = "format", value = "HH:mm  d MMM" },
  { id = "jrmmhm.pocket", key = "members", value = "huacnlee.which-key,omarchy.bluetooth,omarchy.network,omarchy.audio,omarchy.monitor,omarchy.power" },
]

[[plugin]]
id = "huacnlee.which-key"
repo = "https://github.com/huacnlee/omarchy-which-key"
commit = "a80451064fb1f354cb86ecad0a3d610218e75bd5"
note = "Hold Super for a guide to the bindings you can press next."

[[plugin]]
id = "jrmmhm.pocket"
repo = "https://github.com/jrmmhm/omarchy-pocket"
commit = "3002564dc4c57b52958a6fff9dcae006f138cb57"
note = "Holds the right side of the bar behind one mark (see [defaults.bar])."

# ------------------------------------------------------------------ quiet

[[transform]]
id = "no-animations"
type = "lua.set"
path = "animations.enabled"
value = false

[[transform]]
id = "no-blur"
type = "lua.set"
path = "decoration.blur.enabled"
value = false

[[transform]]
id = "no-shadows"
type = "lua.set"
path = "decoration.shadow.enabled"
value = false

[[transform]]
id = "square-corners"
type = "lua.set"
path = "decoration.rounding"
value = 0

[[transform]]
id = "tight-gaps-in"
type = "lua.set"
path = "general.gaps_in"
value = 2

[[transform]]
id = "tight-gaps-out"
type = "lua.set"
path = "general.gaps_out"
value = 4

# The keys that opened the world clock, weather and Agents panels. Bind one
# again in ~/.config/hypr/bindings.lua and yours wins.
[[transform]]
id = "no-weather-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + W"

[[transform]]
id = "no-world-clock-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + E"

# The Agents panel key exists on edge and the next releases, not on 4.5.
[[transform]]
id = "no-agents-key"
type = "bind.remove"
keys = "SUPER + CTRL + X"
optional = true

# ------------------------------------------------------------ vim windows

[[transform]]
id = "focus-left"
type = "bind.add"
keys = "SUPER + H"
description = "Focus left"
action = { focus = "l" }


[[transform]]
id = "focus-down"
type = "bind.replace"
keys = "SUPER + J"
description = "Focus down"
action = { focus = "d" }


[[transform]]
id = "focus-up"
type = "bind.replace"
keys = "SUPER + K"
description = "Focus up"
action = { focus = "u" }


[[transform]]
id = "focus-right"
type = "bind.replace"
keys = "SUPER + L"
description = "Focus right"
action = { focus = "r" }


[[transform]]
id = "swap-left"
type = "bind.add"
keys = "SUPER + SHIFT + H"
description = "Swap window left"
action = { swap = "l" }


[[transform]]
id = "swap-down"
type = "bind.add"
keys = "SUPER + SHIFT + J"
description = "Swap window down"
action = { swap = "d" }


[[transform]]
id = "swap-up"
type = "bind.add"
keys = "SUPER + SHIFT + K"
description = "Swap window up"
action = { swap = "u" }


[[transform]]
id = "swap-right"
type = "bind.add"
keys = "SUPER + SHIFT + L"
description = "Swap window right"
action = { swap = "r" }


# What the vim keys displaced.
[[transform]]
id = "toggle-split-key"
type = "bind.add"
keys = "SUPER + SEMICOLON"
description = "Toggle window split"
action = { layout = "togglesplit" }

[[transform]]
id = "cycle-layout-key"
type = "bind.add"
keys = "SUPER + BACKSLASH"
description = "Cycle workspace layout"
action = { omarchy = "omarchy-hyprland-workspace-layout-toggle" }

# Super+? (Shift+Slash) was 1Password, one of the web-app shortcuts below.
[[transform]]
id = "keybindings-key"
type = "bind.replace"
keys = "SUPER + SHIFT + SLASH"
description = "Keybindings"
action = { omarchy = "omarchy-menu-keybindings" }

