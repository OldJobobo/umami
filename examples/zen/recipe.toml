# Zen: a quiet, keyboard-first Omarchy.
#
# Less on screen: no animations, blur or shadows, square tight tiles, and a
# bar without the world clock, weather and AI usage widgets. More from the
# keyboard: vim keys for windows, Vimarchy's window hints, and a which-key
# guide whenever you hold Super. The web-app shortcuts are gone, so Super+Shift
# is free for moving windows.
#
#   Super + H/J/K/L            focus left/down/up/right
#   Super + Shift + H/J/K/L    swap the window left/down/up/right
#   Super + '                  Vimarchy: a hint on every window, type it to jump
#   hold Super                 which-key: every binding you can press next
#   Super + ;                  toggle split        (was Super + J)
#   Super + Backslash          cycle layout        (was Super + L)
#   Super + ?                  keybindings sheet   (was Super + K)
#   Super + Shift + Space      hide or show the bar (stock)
#
# The plugins come from the Omarchy marketplace (plugins.omarchy.org), are
# installed for each user at login as ordinary user plugins, and are pinned to
# the commit the marketplace validated, as of 2026-11-16.
#
# One step is yours: which-key hooks into Hyprland by adding a marked block to
# your own ~/.config/hypr/bindings.lua, so the flavor leaves that to you. Open
# the Which Key widget's settings in the bar and turn on Enabled.

[flavor]
name = "zen"

[[plugin]]
id = "huacnlee.which-key"
repo = "https://github.com/huacnlee/omarchy-which-key"
commit = "a80451064fb1f354cb86ecad0a3d610218e75bd5"
note = "Hold Super for a guide to the bindings you can press next."

[[plugin]]
id = "vimarchy"
repo = "https://github.com/clickety-clacks/vimarchy"
commit = "30601976903821a82097ab568f10aae56564c32f"
note = "Vimium-style hints over every window."

[[plugin]]
id = "jrmmhm.pocket"
repo = "https://github.com/jrmmhm/omarchy-pocket"
commit = "3002564dc4c57b52958a6fff9dcae006f138cb57"
note = "Tucks bar widgets you rarely use behind one mark."

# ------------------------------------------------------------------ quiet

[[transform]]
id = "no-animations"
type = "lua.set"
path = "animations.enabled"
value = false

[[transform]]
id = "no-blur"
type = "lua.set"
path = "decoration.blur.enabled"
value = false

[[transform]]
id = "no-shadows"
type = "lua.set"
path = "decoration.shadow.enabled"
value = false

[[transform]]
id = "square-corners"
type = "lua.set"
path = "decoration.rounding"
value = 0

[[transform]]
id = "tight-gaps-in"
type = "lua.set"
path = "general.gaps_in"
value = 2

[[transform]]
id = "tight-gaps-out"
type = "lua.set"
path = "general.gaps_out"
value = 4

[[transform]]
id = "quiet-bar"
type = "shell.plugins.remove"
ids = ["omarchy.elsewhen", "omarchy.weather", "omarchy.agents"]

# And the keys that opened them.
[[transform]]
id = "no-weather-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + W"

[[transform]]
id = "no-world-clock-key"
type = "bind.remove"
keys = "SUPER + CTRL + ALT + E"

# The Agents panel key exists on edge and the next releases, not on 4.5.
# hl.unbind does nothing where the key isn't bound.
[[transform]]
id = "no-agents-key"
type = "lua"
code = 'hl.unbind("SUPER + CTRL + X")'

# ------------------------------------------------------------ vim windows

[[transform]]
id = "focus-left"
type = "bind.add"
keys = "SUPER + H"
description = "Focus left"
lua = 'hl.dsp.focus({ direction = "l" })'


[[transform]]
id = "focus-down"
type = "bind.replace"
keys = "SUPER + J"
description = "Focus down"
lua = 'hl.dsp.focus({ direction = "d" })'


[[transform]]
id = "focus-up"
type = "bind.replace"
keys = "SUPER + K"
description = "Focus up"
lua = 'hl.dsp.focus({ direction = "u" })'


[[transform]]
id = "focus-right"
type = "bind.replace"
keys = "SUPER + L"
description = "Focus right"
lua = 'hl.dsp.focus({ direction = "r" })'


[[transform]]
id = "swap-left"
type = "bind.add"
keys = "SUPER + SHIFT + H"
description = "Swap window left"
lua = 'hl.dsp.window.swap({ direction = "l" })'


[[transform]]
id = "swap-down"
type = "bind.add"
keys = "SUPER + SHIFT + J"
description = "Swap window down"
lua = 'hl.dsp.window.swap({ direction = "d" })'


[[transform]]
id = "swap-up"
type = "bind.add"
keys = "SUPER + SHIFT + K"
description = "Swap window up"
lua = 'hl.dsp.window.swap({ direction = "u" })'


[[transform]]
id = "swap-right"
type = "bind.add"
keys = "SUPER + SHIFT + L"
description = "Swap window right"
lua = 'hl.dsp.window.swap({ direction = "r" })'


# What the vim keys displaced.
[[transform]]
id = "toggle-split-key"
type = "bind.add"
keys = "SUPER + SEMICOLON"
description = "Toggle window split"
lua = 'hl.dsp.layout("togglesplit")'

[[transform]]
id = "cycle-layout-key"
type = "bind.add"
keys = "SUPER + BACKSLASH"
description = "Cycle workspace layout"
run = "omarchy-hyprland-workspace-layout-toggle"

# Super+? (Shift+Slash) was 1Password, one of the web-app shortcuts below.
[[transform]]
id = "keybindings-key"
type = "bind.replace"
keys = "SUPER + SHIFT + SLASH"
description = "Keybindings"
run = "omarchy-menu-keybindings"

[[transform]]
id = "vimarchy-keys"
type = "lua"
source = "vimarchy.lua"

